; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:mercurio_v1]
platform = espressif32
board = mercurio_v1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; Make include/ visible to lib/ sources too (e.g. lib/mcp23017 uses pins.h)
    -Iinclude

    ; Native USB-CDC on the ESP32-S3's USB-OTG peripheral (GPIO19/20).
    ; USB_MODE=0 = TinyUSB (OTG); the framework auto-starts Serial before setup().
    ; USB_MODE=1 (HWCDC) does NOT auto-start, so early prints are lost — keep at 0.
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; TFT_eSPI custom pin/driver configuration (replaces User_Setup.h)
    ; USE_HSPI_PORT gives the display/SD bus its own SPI host (SPI3),
    ; leaving the default global SPI (SPI2) free for touch + LoRa.
    -DUSE_HSPI_PORT=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=18
    -DTFT_DC=15
    -DTFT_BL=11
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI
    jgromes/RadioLib
    paulstoffregen/XPT2046_Touchscreen
    mikalhart/TinyGPSPlus
    h2zero/NimBLE-Arduino
    bodmer/TJpg_Decoder
    bitbank2/PNGdec
    earlephilhower/ESP8266Audio @ ^1.9.7
