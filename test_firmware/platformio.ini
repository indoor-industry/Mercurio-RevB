; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:freenove_esp32_s3_wroom]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

; Board is actually an ESP32-S3-WROOM-1 N16R8 (16MB flash / 8MB PSRAM).
; The freenove_esp32_s3_wroom board profile defaults to N8R8 (8MB/8MB);
; flash_mode/psram_type/memory_type already match N16R8, only the flash
; size and partition table need to change.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    ; Make include/ visible to lib/ sources too (e.g. lib/mcp23017 uses pins.h)
    -Iinclude

    ; This board has no USB-UART bridge: enable native USB-CDC on the
    ; ESP32-S3's USB-OTG peripheral (GPIO19/20) for Serial, freeing
    ; UART0 (GPIO43/44) for GPS Serial1.
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=1
    -UARDUINO_USB_CDC_ON_BOOT
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; TFT_eSPI custom pin/driver configuration (replaces User_Setup.h)
    ; USE_HSPI_PORT gives the display/SD bus its own SPI host (SPI3),
    ; leaving the default global SPI (SPI2) free for touch + LoRa.
    -DUSE_HSPI_PORT=1
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=18
    -DTFT_DC=15
    -DTFT_BL=11
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSPI_FREQUENCY=40000000

lib_deps =
    bodmer/TFT_eSPI
    jgromes/RadioLib
    paulstoffregen/XPT2046_Touchscreen
    mikalhart/TinyGPSPlus
    h2zero/NimBLE-Arduino
    bodmer/TJpg_Decoder
    bitbank2/PNGdec
    earlephilhower/ESP8266Audio @ ^1.9.7
